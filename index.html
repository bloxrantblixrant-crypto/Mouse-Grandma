<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Survival 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* MAIN MENU */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(15,15,30,0.95), rgba(40,20,60,0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            text-align: center;
        }
        #main-menu h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffcc00, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255,140,0,0.4);
        }
        #main-menu p {
            font-size: 1.2rem;
            color: #b0bec5;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .menu-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff9800, #f44336);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,87,34,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
        /* HUD UI */
        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 18px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 8px;
            display: inline-block;
        }
        /* JOYSTICK */
        #joystick-zone {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            touch-action: none;
            z-index: 5;
        }
        #joystick-knob {
            position: absolute;
            top: 35px; left: 35px;
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        /* GAME OVER SCREEN */
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 10, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff4444;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 20;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="main-menu">
        <h1>🐭 MOUSE SURVIVAL 3D</h1>
        <p>Explore Grandma's House, Avoid the Cat & Grandma, Find Furniture & Escape!</p>
        <button class="menu-btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <div id="ui">
        <div class="hud-panel">🧀 Cheese: <span id="cheese-count">0</span></div><br>
        <div class="hud-panel">❤️ Health: <span id="health-bar">♥♥♥</span></div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="game-over">
        <div id="death-reason" style="margin-bottom: 20px;">YOU DIED!</div>
        <div style="font-size: 1.2rem; color: #ffeb3b;">😴 Sleeping for 3s... Waking up in mouse house...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
