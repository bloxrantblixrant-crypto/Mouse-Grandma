<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cheese Quest - City Escape</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Start Menu Overlay -->
    <div id="main-menu" class="overlay-screen">
        <div class="glass-card">
            <h1 class="glow-title">🧀 CHEESE QUEST 🧀</h1>
            <p class="subtitle">Spawn in safe mouse holes, collect 500 cheese, slay enemies, and escape to the City!</p>
            <button id="play-btn" class="glow-btn">PLAY GAME</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="ui" style="display: none;">
        <div class="hud-top-right">
            <div class="hud-stat">
                <span class="hud-icon">🧀</span>
                <span id="cheese-count" class="hud-value">0</span>
            </div>
            <div class="hud-stat">
                <span class="hud-icon">❤️</span>
                <span id="health-bar" class="hud-value">♥♥♥</span>
            </div>
        </div>
    </div>

    <!-- Fixed Touch Joystick -->
    <div id="joystick-zone" style="display: none;">
        <div id="joystick-knob"></div>
    </div>

    <!-- UI Overlay Alerts -->
    <div id="game-over" class="overlay-screen" style="display: none;">
        <div class="glass-card alert-card">
            <h2 id="death-reason" class="alert-title">YOU DIED!</h2>
        </div>
    </div>

    <div id="win-screen" class="overlay-screen" style="display: none;">
        <div class="glass-card win-card">
            <h2 class="glow-title">🏡 ESCAPED TO BLUE HOUSE!</h2>
            <p class="subtitle">You unlocked the next level!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
